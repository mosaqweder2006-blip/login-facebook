<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
</head>
<body style="height: 100vh; display: flex; align-items: center;justify-content: center;">
    <form action="" method="post">
        <h1>Account Creation Page..</h1>
        <label for="Fname">Name</label><br><br>
        <input id="Fname" type="text" placeholder="Ferst name" required>
        <input type="text" placeholder="Last name" required>

        <br><br><br><br>

        <label for="dob">Birthday??</label><br><br>
        <input id="dob" type="date" name="dob" required>

        <br><br><br><br>

        <label for="Gender">Gender??</label><br><br>
        <select name="Gender" id="Gender">
            <option disabled selected>Select your gender</option>
            <option value="male">male</option>
            <option value="female">female</option>
        </select>

        <br><br><br><br>

        <label for="mail">Mobile number or email</label><br><br>
        <input id="mail" type="email" name="mail" placeholder="Mobile number or email" required>

        <br><br><br><br>

        <label for="pass">Password</label><br><br>
        <input id="pass" type="password" name="password" placeholder="Password" required>

        <br><br><br><br>

        <button type="submit">submit</button><br><br>
        <a href="LoginFacebook.html">I already have an account</a>
    </form>
</body>
</html>
